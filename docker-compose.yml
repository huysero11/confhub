services:
  # Seq: nơi gom log có cấu trúc của API. Giao diện + nhận log cùng ở http://localhost:5341
  seq:
    image: datalust/seq
    container_name: confhub-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Chỉ dùng trên máy dev: bỏ đăng nhập cho tiện
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  # RabbitMQ: hàng đợi tin nhắn giữa các phần của hệ thống (sự kiện RegistrationApproved, ScheduleChanged...).
  rabbitmq:
    image: rabbitmq:4-management
    container_name: confhub-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # cổng API gửi/nhận tin nhắn (giao thức AMQP)
      - "15672:15672"   # trang quản lý http://localhost:15672 (guest/guest, chỉ dùng trên máy dev)

  # smtp4dev: máy chủ mail giả cho máy dev — nhận mọi email API gửi ra, không gửi tới hộp thư thật.
  # Xem thư ở http://localhost:5000
  smtp4dev:
    image: rnwood/smtp4dev
    container_name: confhub-smtp4dev
    restart: unless-stopped
    ports:
      - "5000:80"       # giao diện web xem thư
      - "2525:25"       # cổng SMTP, API gửi mail tới đây (appsettings.Development.json → Smtp:Port)

volumes:
  seq-data:
