services:
  # Seq: nơi gom log có cấu trúc của API. Giao diện + nhận log cùng ở http://localhost:5341
  seq:
    image: datalust/seq
    container_name: confhub-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Chỉ dùng trên máy dev: bỏ đăng nhập cho tiện
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  seq-data:
