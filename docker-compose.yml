services:
  # Seq: nơi gom log có cấu trúc của API. Giao diện + nhận log cùng ở http://localhost:5341
  seq:
    image: datalust/seq
    container_name: confhub-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Chỉ dùng trên máy dev: bỏ đăng nhập cho tiện
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  # RabbitMQ: hàng đợi tin nhắn giữa các phần của hệ thống (sự kiện RegistrationApproved, ScheduleChanged...).
  rabbitmq:
    image: rabbitmq:4-management
    container_name: confhub-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # cổng API gửi/nhận tin nhắn (giao thức AMQP)
      - "15672:15672"   # trang quản lý http://localhost:15672 (guest/guest, chỉ dùng trên máy dev)

volumes:
  seq-data:
